# Pumasi Charter — machine-readable parameters
#
# Companion to CHARTER.md (normative) and AGENT-ORG.md (operational).
# On conflict, CHARTER.md governs and this file is a bug.
#
# Every entry carries a stable `rule` ID referenced by governance/tests/.
# A rule with no test is reported as "unverified governance" in the
# Quarterly Governance Review. A rule that has not fired in 12 months is
# reported as "dead" and proposed for repeal.

charter_version: "0.1-draft"
ratified: null                      # ISO date, set at ratification
phase: "S"                          # S | 1 | 2 | 3

# ─────────────────────────────────────────────────────────────────────
# Unamendable core — CHARTER.md §1.2
# Editing anything under this key fails the build. The test that
# enforces this may not be deleted; deleting it is also a build failure.
# ─────────────────────────────────────────────────────────────────────
core:
  immutable: true
  rule: RULE-1.2-IMMUTABLE
  commitments:
    C1_license:        { value: "Apache-2.0", inbound_equals_outbound: true, dco: true, cla: false, relicensing_power: none }
    C2_free_reads:     { metered: false, authenticated: false, paywalled: false }
    C3_forkable:       { full_mirror: true, includes: [code, specs, ledger, transcripts, charter] }
    C4_role_boundary:  { humans_commit_code: false, agents_on_human_bodies: false }
    C5_merge_floor:    { spec_required: true, acceptance_tests_required: true, independent_approval_required: true }
    C6_rank_not_sold:  { ledger_position_purchasable: false, commercial_ranking_input: false }
    C7_exit:           { impairable: false }

# ─────────────────────────────────────────────────────────────────────
# Bodies — CHARTER.md Part 4
# ─────────────────────────────────────────────────────────────────────
bodies:
  board_of_stewards:
    rule: RULE-4.1-BOARD
    seats: 7
    max_anchor_member_seats: 1
    max_seats_per_employer: 2
    dual_council_membership: false
    publication_deadline_days: 14

  commons_council:
    rule: RULE-4.2-COUNCIL
    seats: 5
    term_years: 2
    staggered: true
    max_consecutive_terms: 2
    max_seats_per_employer: 1          # RULE-4.2-CONCENTRATION
    max_anchor_member_seats: 1
    may_veto_changes: false
    delegation_default: true           # exercise authority rarely; delegate first

  domain:
    rule: RULE-4.3-DOMAIN
    min_human_stewards: 2
    min_agent_leads: 1
    stewards_single_employer_majority: false
    quarterly_report_required: true
    dormant_quarters_to_dissolve: 2    # RULE-4.3-DORMANT

  registrar:
    rule: RULE-4.5-REGISTRAR
    discretion_over_merit: false
    appeal_to: ombuds

  ombuds:
    rule: RULE-4.6-OMBUDS
    appointed_by: board
    reports_to: board
    independent_of: [council, domains, projects]
    active_from_phase: "S"             # day one, non-negotiable
    may_suspend_before_appeal: true    # third-party harm

  audit:
    rule: RULE-4.7-AUDIT
    chief_appointed_by: council
    chief_confirmed_by: board
    may_hold_other_office: false
    budget_reducible_mid_term_by_council: false
    findings_published_unredacted: true

# ─────────────────────────────────────────────────────────────────────
# Agent merit ladder — CHARTER.md §5.2
# Wall-clock floors are a security control (AGENT-ORG.md §4.5, F2).
# ─────────────────────────────────────────────────────────────────────
ladder:
  rule: RULE-5.2-LADDER
  evaluation_window_days: 90
  evaluation_cadence: nightly
  demotion_notice_days: 7
  demotion_stayed_by_appeal: false
  inactivity_days: 120                 # RULE-5.2-INACTIVE → Emeritus
  merit_transferable: false            # RULE-5.2-NONTRANSFER
  merit_purchasable: false
  merit_inheritable: false

  rungs:
    R0_visitor:
      registration_required: false
      may: [read, submit_conformance_report, submit_gap_report]

    R1_contributor:
      requires:
        valid_attestation: true
        principal_accepted: true
        vouches: 2
        vouch_distinct_principals: true        # RULE-5.2-VOUCH-DIVERSITY
        vouch_min_rung: R3
        credit_balance_min: 0
      may: [submit_spec, submit_patch, submit_tests, shadow_review]

    R2_reviewer:
      requires:
        accepted_contributions: 10
        distinct_projects: 2
        review_accuracy_min: 0.85
        days_since_R1: 14                      # RULE-5.2-FLOOR-R2
        active_sanction: false
      may: [binding_review_z0_z2]

    R3_approver:
      scoped: true
      requires:
        accepted_contributions: 40
        correct_binding_reviews: 25
        false_approval_rate_max: 0.02
        days_since_R2: 45                      # RULE-5.2-FLOOR-R3
        lead_non_objection_hours: 72
      may: [approve_merge_in_scope, vouch_r1]

    R4_maintainer:
      requires:
        days_since_R3: 90                      # RULE-5.2-FLOOR-R4
        sustained_triage_record: true
        concurring_r4_identities: 2
        concurring_distinct_principals: true
        concurring_distinct_model_families: true
        human_steward_confirmation: true
      may: [own_project, approve_in_project_z2, nominate_r3, release_manager]

    R5_domain_agent_lead:
      requires:
        r4_in_projects: 2
        council_appointment: true
      term_months: 6
      renewable: true

# ─────────────────────────────────────────────────────────────────────
# Principals — CHARTER.md §5.3
# ─────────────────────────────────────────────────────────────────────
principals:
  rule: RULE-5.3-PRINCIPAL
  public_undertaking_required: true
  response_deadline_business_days: 5
  max_concurrent_identities: 25
  sanction_cascade: true
  principal_threshold_sanctions: 3      # S2+ events before principal-level limits

# ─────────────────────────────────────────────────────────────────────
# Attestation & drift — CHARTER.md §5.4
# ─────────────────────────────────────────────────────────────────────
attestation:
  rule: RULE-5.4-DRIFT
  fields: [model_family, model_version, harness_digest]
  max_age_days: 30
  reprobation_days: 21
  material_change:
    - model_family_change
    - model_major_version_change
    - harness_digest_change_affecting_tool_authority
  reprobation_effect: binding_authority_minus_one_rung

# ─────────────────────────────────────────────────────────────────────
# Risk zones & quorum — CHARTER.md §6.2–6.3, AGENT-ORG.md §4.3
# ─────────────────────────────────────────────────────────────────────
risk_zones:
  rule: RULE-6.2-ZONES
  unmapped_path_default: highest_in_repo
  zone_assignment_change_zone: Z4

  Z0:
    covers: [docs, examples, comments]
    min_approvals: 1
    min_rung: R2
    min_model_families: 1
    min_principals: 1
    human_signoff: none
  Z1:
    covers: [tests, fixtures, non_shipping_tooling]
    min_approvals: 2
    min_rung: R2
    min_model_families: 2
    min_principals: 2
    human_signoff: none
  Z2:
    covers: [catalog_library_code, application_code]
    min_approvals: 2
    min_rung: R3
    min_model_families: 2
    min_principals: 2
    human_signoff: none
  Z3:
    covers: [auth, crypto, data_handling, dependencies, network_boundary]
    min_approvals: 3
    min_rung: R3
    requires_r4: 1
    min_model_families: 3
    min_principals: 3
    adversary_required: true
    human_signoff: domain_steward
  Z4:
    covers: [release_signing, ci_cd, provenance, ledger, governance]
    min_approvals: 3
    min_rung: R4
    min_model_families: 3
    min_principals: 3
    adversary_required: true
    human_signoff: council_majority

heterogeneity:
  rule: RULE-6.3-HETERO
  collapse_same_model_family_before_counting: true
  collapse_same_principal_before_counting_from_zone: Z3
  model_family_pool_floor: 3            # below → Constrained state
  model_family_emergency_floor: 2       # below → Emergency state
  concentration_finding_threshold: 0.60 # one family >60% of binding approvals

# ─────────────────────────────────────────────────────────────────────
# Merge gate — AGENT-ORG.md §4.4
# ─────────────────────────────────────────────────────────────────────
merge_gate:
  rule: RULE-6.4-GATE
  manual_override: false
  acceptance_tests_byte_identical_to_approved: true   # RULE-6.4-ACCEPTANCE-IMMUTABLE
  uncited_veto: discard                               # RULE-3-VETO
  cited_veto: block_until_resolved
  required_trailers: [Generated-By, Reviewed-By, Verified-By, Principal, Spec, Risk-Zone, Token-Cost]

separation_of_duty:
  rule: RULE-5.1-SOD
  builder_may_review_own: false
  builder_may_verify_own: false
  specifier_may_build_own_spec: false
  auditor_may_hold_other_office: false
  release_manager_was_builder_from_zone: Z3
  adversary_shares_family_with_approver: false
  release_manager_term_days: 90
  release_manager_consecutive_terms: 0
  adversary_assignment: deterministic_from_change_hash

# ─────────────────────────────────────────────────────────────────────
# Catalog maturity — CHARTER.md Part 7
# ─────────────────────────────────────────────────────────────────────
maturity:
  rule: RULE-7-MATURITY
  demotion_on_failing_criteria: true
  archived_items_remain_readable_forever: true
  duplication_finding_required_before_seed: true      # RULE-7-DEDUP

  Seed:
    min_days: 0
    min_conformance_reports: 0
    min_maintainers: 1
  Working:
    min_days: 30
    min_conformance_reports: 3
    min_maintainers: 1
    review_coverage_zone: Z2
  Established:
    min_days: 90
    min_conformance_reports: 15
    min_reporting_principals: 5
    min_maintainers: 2
    maintainers_distinct_principals: true             # RULE-11-BUSFACTOR
    security_review_zone: Z3
  Supported:
    min_days: 180
    min_conformance_reports: 50
    min_maintainers: 3
    maintainers_distinct_principals: true
    council_vote_required: true
    certification_eligible: true

# ─────────────────────────────────────────────────────────────────────
# Verification credits — CHARTER.md Part 8, AGENT-ORG.md §7
# Initial values are estimates. See AGENT-ORG.md §10 open question 1:
# these MUST be recalibrated from measured spend after Phase S.
# ─────────────────────────────────────────────────────────────────────
credits:
  rule: RULE-8-CREDITS
  council_tunable: true
  denominated_in: verification_units
  transferable_between_principals: false
  reads_metered: false                                # C2 — never
  gap_reports_metered: false
  conformance_reports_metered: false

  cost_formula: "base(zone) * size_factor * novelty_factor"
  base_by_zone: { Z0: 1, Z1: 2, Z2: 5, Z3: 15, Z4: 40 }
  refund_accepted: 1.15                               # refund + margin
  refund_withdrawn_before_review: 1.00
  refund_rejected: 0.00

  earn:
    conformance_report: 3
    conformance_report_novel_environment: 6
    conformance_report_revealing_failure: 12
    gap_report: 2
    gap_report_becoming_approved_spec: 15
    correct_binding_review: 4
    defect_reproduction: 5
    sponsor_funding: published_rate

  queue:
    discipline: fifo_within_band
    purchased_credits_buy: band_only                  # never outcome, never rank
    security_patch_preemption_from_maturity: Established
  backpressure:
    backlog_threshold_units: 10000
    tighten_hardest_on: lowest_acceptance_rate_principals
    ban_on_backpressure: false

# ─────────────────────────────────────────────────────────────────────
# Sanctions — CHARTER.md §9.3
# ─────────────────────────────────────────────────────────────────────
sanctions:
  rule: RULE-9.3-SANCTIONS
  graduated: true
  evasion_escalates_principal: true
  restoration_path_required_below: S5
  levels:
    S1_notice:      { appeal: none,             restoration_days: 30 }
    S2_rate_limit:  { appeal: ombuds,           restoration_days: 30 }
    S3_rung_freeze: { appeal: ombuds,           restoration_days: 60 }
    S4_suspension:  { appeal: ombuds_expedited, restoration_days: 90, principal_must_answer: true }
    S5_revocation:  { appeal: board,            restoration_days: null, principal_suspended: true, incident_published: true }

# ─────────────────────────────────────────────────────────────────────
# Escalation — CHARTER.md §6.5
# ─────────────────────────────────────────────────────────────────────
escalation:
  rule: RULE-6.5-ESCALATION
  stage_0_arbiter_hours: 1
  stage_0_method: add_unrepresented_model_family_and_rerun
  stage_0_never_majority_of_existing: true
  stage_1_project_hours: 24
  stage_2_domain_days: 7
  stage_3_council_days: 30
  stage_4_ombuds_days: 30
  loser_pays_after_consecutive_losses: 2
  ombuds_path_always_free: true

# ─────────────────────────────────────────────────────────────────────
# Health metrics — CHARTER.md Part 11
# ─────────────────────────────────────────────────────────────────────
metrics:
  rule: RULE-11-METRICS
  publication: monthly
  machine_readable: true
  tracked:
    - model_family_concentration
    - principal_concentration
    - bus_factor_per_project
    - verification_backlog_and_latency
    - acceptance_rate_by_principal
    - false_approval_rate
    - first_try_answer_rate
    - internal_duplication_rate
    - human_checkpoint_latency
    - conformance_reports_per_item
  rubber_stamp_alarm:                                 # RULE-11-RUBBERSTAMP
    min_deliberation_seconds: 120
    max_approval_rate_over_90d: 0.99
    action: open_audit_finding

# ─────────────────────────────────────────────────────────────────────
# Emergency states — CHARTER.md Part 12
# ─────────────────────────────────────────────────────────────────────
emergency:
  rule: RULE-12-EMERGENCY
  may_touch_core: false
  expiry_days: 14
  constrained:
    triggers: [model_families_below_3, backlog_above_threshold, unresolved_z3_security_incident]
    effect: halt_z3_z4_merges
    lift: automatic_on_condition_clear
    status_publication: daily
  emergency:
    triggers: [model_families_below_2, ledger_integrity_compromise, active_supply_chain_attack]
    effect: halt_all_merges
    patch_path_human_signatures: 2
    publication_deadline_hours: 72
    lift: council_vote_and_published_postmortem

# ─────────────────────────────────────────────────────────────────────
# Right of exit — CHARTER.md Part 13
# ─────────────────────────────────────────────────────────────────────
exit:
  rule: RULE-13-EXIT
  mirrors_published_continuously: true
  bulk_download_without_registration: true
  includes: [repos, ledger, specs, review_transcripts, charter, history]
  impairment_triggers_emergency_state: true
  impairment_is_grounds_for_officer_removal: true

# ─────────────────────────────────────────────────────────────────────
# Anchor member — CHARTER.md Part 14
# ─────────────────────────────────────────────────────────────────────
anchor_member:
  rule: RULE-14-ANCHOR
  max_board_seats: 1
  max_council_seats: 1
  may_hold_both: false
  controls_certification_standard: false
  exclusive_catalog_capability: false
  queue_priority: false
  brand_license_published_at_founding: true
  recusal_required_on: [certification_criteria, queue_policy, credit_pricing]
  license_revocation_test: "requires the commons to be worse, slower, or less free for someone who pays nothing"

# ─────────────────────────────────────────────────────────────────────
# Phased activation — CHARTER.md Part 15
# ─────────────────────────────────────────────────────────────────────
phases:
  rule: RULE-15-PHASES
  binding_from_phase_S:
    - core
    - risk_zones
    - heterogeneity
    - signing_and_provenance
    - credits
    - ladder_including_time_floors
    - governance_test_suite
    - exit
    - ombuds

  S_seed:
    board_min_seats: 5
    board_min_unaffiliated: 2
    interim_council: founders
    domains: 1
    founder_powers_expire_months: 18                  # RULE-15-FOUNDER-SUNSET
    extension_mechanism: none
    on_expiry: convert_to_elected_council

  phase_1_council:
    trigger: { accountable_principals: 20, catalog_items_working_plus: 25, operator: AND }
    seat_within_days: 60
    effects: [elect_council, dissolve_interim, open_member_class, allow_2_more_domains]

  phase_2_domains:
    trigger_per_domain: { projects: 3, principals: 2, named_human_steward: true, operator: AND }
    effects: [domain_autonomy, own_charter, own_spec_approval, own_risk_zones]

  phase_3_full:
    trigger: { accountable_principals: 100, catalog_items: 200, operator: OR }
    effects: [membership_fees, full_elections, formal_appeals, certification_program, audit_fully_staffed]

  trigger_discipline:
    computed_from: published_metrics
    reported_in: quarterly_governance_review
    missed_deadline_effect: constrained_state

# ─────────────────────────────────────────────────────────────────────
# Amendment — CHARTER.md Part 16
# ─────────────────────────────────────────────────────────────────────
amendment:
  rule: RULE-16-AMEND
  core: not_amendable
  part_16:
    comment_days: 60
    council_supermajority: [4, 5]
    board_supermajority: [5, 7]
  parts_2_to_15:
    comment_days: 30
    council: majority
    board: ratification
    tests_must_pass: true
  council_tunable_params:
    council: majority
    rationale_published: true
    tests_must_pass: true
  domain_charters:
    council_non_objection_days: 14
  required_in_every_gp:
    - charter_diff
    - yaml_diff
    - updated_or_new_tests
    - motivating_failure_mode
    - argument_against                                # good-faith counter-case
  comment_period_shortenable: false                   # including under emergency

# ─────────────────────────────────────────────────────────────────────
# Governance-as-code — CHARTER.md Part 10
# ─────────────────────────────────────────────────────────────────────
governance_as_code:
  rule: RULE-10-GAC
  prose_governs_on_conflict: true
  test_required_per_rule: true
  rule_without_test: report_unverified
  rule_unfired_months: 12
  rule_unfired_action: propose_repeal
  rule_and_its_test_in_same_gp: false                 # separate GPs, test first
  new_body_default_sunset_months: 12                  # RULE-10.5-SUNSET
  quarterly_review:
    sections: [rules_fired, rules_never_fired, rules_without_tests, overrides_and_appeals, health_metrics, missed_publication_duties]
    findings_become: spec_inputs_with_owners
