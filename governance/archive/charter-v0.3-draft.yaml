# Pumasi Charter — machine-readable companion
# CHARTER.md is normative. Where prose and this file disagree, the prose governs
# and this file is a bug — file it as a defect.

charter_version: "0.3-draft"
supersedes: ["0.1-draft", "0.2-draft"]
sources: [pumasi-whitepaper-v1.0.md, pumasi-commercialization-foundations.md]

# ─────────────────────────────────────────────────────────────────────
# Part 1 — Permanent commitments. Not amendable, ever.
# ─────────────────────────────────────────────────────────────────────
permanent:
  immutable: true
  P1_license:        {spdx: Apache-2.0, inbound_equals_outbound: true, dco: true,
                      relicensing_agreements_accepted: false}
  P2_read:           {free: true, metered: false, authenticated: false}
  P3_forkable:       {full_mirror: true, permission_required: false, includes: [charter, ledger]}
  P4_humans:         {commit_code: false}
  P5_merge:          {spec_required: true, tests_must_pass: true,
                      approval_from_other_model_family: 1}
  P6_ledger:         {for_sale: false, input_to_commercial_ranking: false}
  P7_never:          [open_core, dual_licensing, license_switch, metered_reads,
                      advertising, hosted_exclusive_features]
  P8_exit:           {may_not_be_impaired: true}
  P9_ledger_rank:    {records: [agent, model, sponsor, token_cost],
                      is_only_rank: true, contribution_earns_standing: true}
  P10_self_hosting:  {first_class_forever: true, hosted_exclusive_features: false}
  P11_budget:        {published: true, sources_published: true}
  P12_substrate:     {ground_truth: [plain_text, git, open_web],
                      special_protocol_required: false}
  one_test: "does it require the commons to be worse, slower, or less free for
             someone who pays nothing?  if yes -> does not ship"

# ─────────────────────────────────────────────────────────────────────
# Part 2 — Who decides
# ─────────────────────────────────────────────────────────────────────
roles:
  steward:
    human: true
    decides: [item_deserves_to_exist,          # one per catalog item
              intent_statement_is_correct,     # the one page they DO read
              item_may_touch_can_hurt_surface, # once, at authorisation
              can_hurt_item_may_be_released]   # on a plain-language release note
    reads: [intent_statement, release_note]    # one page each
    reviews: none                              # not specs, not tests, not diffs
    commits_code: false
    rationale: "WP 2 assigns specification to agents; humans choose what is worth
                building and answer for it, at item level not clause level"
  agent:
    does: [specify, build, review, test, release, maintain]

sole_steward_authority:
  ends_at_earliest_of: [second_accountable_party, "2028-01-28"]
  date_movable: false
  may_extend_itself: false

structure:                                  # commercialization foundations §2, §8
  foundation_holds: [repositories, ledger, trademark, certification_standard]
  company_is: ordinary_member
  company_special_rights: none
  required_before: first_revenue
  company_incorporates_as: public_benefit_corporation
  commons_commitments_in_company_charter: true
  certification_terms: equal_and_published
  company_brand_licence_published_at: founding
  certification_standard_owned_by: foundation
  revenue_follows_trust: true               # foundation earns first

# ─────────────────────────────────────────────────────────────────────
# Part 3 — The merge gate. This is the operating core.
# ─────────────────────────────────────────────────────────────────────
intent_statement:                              # CHARTER Part 2.1
  required_before: specification
  max_length: one_page
  plain_language: true
  states: [what_was_understood, what_working_means_in_user_terms,
           what_is_not_being_built, open_questions]
  confirmed_by: steward
  rationale: "cross-family review checks the spec against itself; only this
              checks the spec against what the human wanted"

release_note:                                  # CHARTER Part 2.1
  required_for: can_hurt_items
  max_length: one_page
  plain_language: true
  states: [what_changed, what_could_hurt_someone, what_was_tested, what_is_unknown]
  signed_off_by: steward

merge_gate:
  item_authorised_by_steward: true             # per item, not per change
  spec_authored_by: agent
  spec_reviewed_by_non_author_family: 1        # distinct from the code review
  spec_reviewer_not_among_code_reviewer_families: when_3plus_families_available
  acceptance_tests_frozen_at: spec_review_complete   # before implementation
  builder_may_edit_tests: false
  min_reviews_from_non_builder_family: 1       # of the CODE
  required_trailers: [Agent, Model, Sponsor, Token-Cost, Spec]  # CHARTER Part 3.4
  transcripts_public: true
  failures_published: true
  reporting_requirement_met: true           # Part 5.1, for items that ship software
  provenance_when_reference_studied:        # protects P1, which is unamendable
    reader_and_implementer_differ: true
    reader_and_implementer_families_differ: true
    reader_emits: behavioural_description_only   # never code, sketches, signatures
    recorded_on_change: [what_was_studied, by_whom, implementer_did_not_read]
    incompatible_licence_derived_code: cannot_enter_catalog
  uncited_objection: discard                # WP 3 — no unfalsifiable authorities
  rungs: none                               # trust attaches to proof, not author

# ─────────────────────────────────────────────────────────────────────
# Part 4 — Risk: one boolean, not five zones
# ─────────────────────────────────────────────────────────────────────
risk:
  question: can_this_change_hurt_someone_outside_the_project
  unmapped_or_unclear_defaults_to: can_hurt
  ordinary:
    min_reviews_from_non_builder_family: 1
    steward_signoff: false
  can_hurt:
    min_reviews_from_non_builder_family: 2  # from two DIFFERENT other families
    distinct_model_families_total: 3        # builder + two reviewers
    steward_signoff_per_change: false       # authorised once; released with sign-off
    steward_authorises_surface_once: true
    steward_signs_release: true
  inherited_by_dependencies: true           # substrate of a can-hurt path is can-hurt
  reclassification_to_ordinary: can_hurt_procedure
  assignment_file: RISK_ZONES.yaml

# ─────────────────────────────────────────────────────────────────────
# Part 5 — Every use is a contribution
# ─────────────────────────────────────────────────────────────────────
open_contributions:
  registration_required: false
  accepted: [conformance_report, gap_report, extension]
  release_requires_passing_in_multiple_environments: true

reporting_requirement:                        # CHARTER Part 5.1
  binds: builders                             # never users
  every_catalog_item_must_implement: true
  must_implement_working_opt_out: true
  enforced_at: merge_gate
  gate_checks: [reporting_path_exists, opt_out_stops_egress,
                opt_out_behaviour_parity, payload_inspectable,
                first_run_notice_present]
  item_without_reporting_path: cannot_merge
  item_with_broken_opt_out: cannot_merge
  user_obliged_to_submit: false               # CF 1 — never less free for non-payers
  use_conditioned_on_submission: false

automatic_reporting:                          # CHARTER Part 5.2
  enabled_by_default: true                    # users opt OUT; never opt-in-required
  opt_out:
    available: true
    steps: 1
    degrades_function: false
    signal_transmitted: false                 # choice held locally; nothing sent
    absence_treated_as_signal: false
  applies_to: running_software_only           # never reading — P2 stays unauthenticated
  collects: [test_outcomes, environment_facts]
  crash_traces:
    scrubbed_to: [frame_names, module_names]
    unscrubbable_sent_by_default: false       # offered for deliberate send instead
  never_collects: [user_content, configuration, surrounding_code, user_data]
  # NOT claimed: "no personal data". Reports are signed (P9), so a report
  # identifies its sender — personal data when that sender is a person.
  # The obligation is plain disclosure + a real opt-out, not a claim of anonymity.
  identifies_sender: true
  claims_anonymity: false
  inspectable_before_send: true
  documented_in_repository: true
  input_to_ranking_or_commerce: false         # P6
  published_not_collected: true               # enters the public record, P2/P3
  attributed: [agent, model, sponsor]         # P9 — reports are signed, not anonymous
  user_facing_statement: REPORTING.md
  use_conditioned_on_agreement: false         # disclosure, not terms of use
  opt_out_is_recorded: false

# ─────────────────────────────────────────────────────────────────────
# Part 7 — Amendment
# ─────────────────────────────────────────────────────────────────────
amendment:
  permanent_part_1: not_amendable
  while_draft:                                # nobody is relying on it yet
    steward_may_revise: true
    publish_diff_and_reasoning: true
    waiting_period_days: 0
  draft_ends_at_earliest_of: [first_catalog_item_release, second_accountable_party]
  draft_status_declarable_by_steward: false   # it ends on events, not on say-so
  once_released:
    notice_days: 7
    blocked_by: cited_objection_only
  may_not_touch:                            # by effect, under any name
    - permanent_part_1
    - sole_steward_authority_end_date
    - risk.can_hurt                         # incl. the reclassification rule
    - draft_ends_at_earliest_of              # else "still a draft" is a permanent exemption
    - this_may_not_touch_list

# ─────────────────────────────────────────────────────────────────────
# Part 8 — Deliberately absent. Add on evidence, not in anticipation.
# ─────────────────────────────────────────────────────────────────────
deliberately_absent:
  trust_ladder:      "add when reviewer history predicts quality better than cross-family disagreement"
  rationing_credits: "metering submissions by verification cost — add when that cost
                      is a real constraint. NOT the WP earn loop, which is P9 and present."
  bodies_and_phases: "add when there is more than one human"
  graded_zones:      "add when the Part 4 binary misclassifies and causes harm"
  maturity_levels:   "add when someone depends on an item enough for the label to mean something"
  emergency_states:  "add when there is an emergency"
  long_comment_periods: "add when 7 days proves too short in a real dispute"

governance_as_code:
  prose_governs_on_conflict: true
  test_required_per_rule: true
  rule_without_test: report_unverified
