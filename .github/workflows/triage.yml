# Continuous issue triage — the watch half of the triage loop.
#
# Event-driven: every issue opened or reopened, and every issue comment,
# invokes one agent session that follows tools/TRIAGE.md from the governance
# repository; a daily sweep catches anything an event run missed. The triage
# labels (accepted / rejected / escalated) are the idempotency guard, so
# overlapping runs and empty runs are both safe.
#
# Nothing here reads or writes any other repository.
#
# The standing prompt is tools/TRIAGE.md in this repository, alongside the
# charter it enforces. It used to be fetched from a separate governance repo
# at run time; that repo was merged here on 2026-08-29, so the cross-repo
# checkout is gone and there is still exactly one copy. This file holds only
# the trigger.
#
# Secrets policy (P2/P3): nothing in this public repository, encrypted or
# otherwise. The one credential is added by the steward in the repository's
# Actions secrets — committing funds or a subscription is HUMAN.md ground —
# as either:
#   CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` (a Claude
#     subscription; one-year token, preferred), or
#   ANTHROPIC_API_KEY — metered API billing.
# Until one exists, runs skip with a warning rather than fail, so the
# tracker stays green while the queue simply waits.
name: triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    # Pull-request comments arrive as issue_comment too — triage only real
    # issues — and a bot's own comments never re-trigger a run.
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Triage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set (steward: add one in Settings → Secrets → Actions). Skipping triage."
            exit 0
          fi
          # If both are set the API key would win; prefer the subscription.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
          fi
          claude --dangerously-skip-permissions -p "Follow tools/TRIAGE.md"
